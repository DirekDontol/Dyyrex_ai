<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Nexus OS</title>
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Fake Boot Animation -->
    <div id="boot-screen" class="screen">
        <div class="logo-container">
            <i class="fa-solid fa-compact-disc fa-spin logo-icon"></i>
            <h1>Hybrid Nexus</h1>
            <div class="loading-bar"><div class="loading-progress"></div></div>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="screen hidden glass-panel">
        <div class="login-box">
            <div class="avatar"><i class="fa-solid fa-user"></i></div>
            <h2>Admin</h2>
            <input type="password" id="login-pin" placeholder="Enter PIN (1234)" autofocus>
            <button id="login-btn">Login</button>
        </div>
    </div>

    <!-- Main Desktop -->
    <div id="desktop" class="hidden">
        <!-- Desktop Icons -->
        <div class="desktop-icons">
            <div class="app-icon" onclick="openWindow('notepad', 'Notepad', '<textarea class=\'app-textarea\' placeholder=\'Ketik sesuatu...\'></textarea>')">
                <i class="fa-solid fa-file-lines"></i>
                <span>Notepad</span>
            </div>
            <div class="app-icon" onclick="openWindow('settings', 'Settings', '<h2>Pengaturan OS</h2><p>Ganti tema dan wallpaper di sini.</p>')">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </div>
        </div>

        <!-- Window Container -->
        <div id="windows-container"></div>

        <!-- Start Menu -->
        <div id="start-menu" class="glass-panel hidden">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search apps, files, settings (Ctrl+K)...">
            </div>
            <div class="pinned-apps">
                <!-- Aplikasi yang dipin -->
            </div>
        </div>

        <!-- Taskbar -->
        <div id="taskbar" class="glass-panel">
            <div class="taskbar-left">
                <button id="start-btn" class="taskbar-btn"><i class="fa-brands fa-windows"></i></button>
            </div>
            <div class="taskbar-center" id="open-apps-taskbar">
                <!-- Ikon aplikasi yang sedang terbuka akan muncul di sini -->
            </div>
            <div class="taskbar-right">
                <div class="system-tray">
                    <i class="fa-solid fa-wifi"></i>
                    <i class="fa-solid fa-battery-full"></i>
                </div>
                <div id="clock-container">
                    <span id="time">00:00</span>
                    <span id="date">1 Jan 2026</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Command Palette (Ctrl+K) -->
    <div id="command-palette" class="glass-panel hidden">
        <input type="text" id="cmd-input" placeholder="Search or type a command...">
    </div>

    <script src="script.js"></script>
</body>
</html>
